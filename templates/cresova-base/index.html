<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piedra Viva — Cabañas en Copán</title>
    <meta name="description" content="Seis cabañas de madera y piedra sobre la montaña de Copán Ruinas." />

    <!--
      The type pairing. Swap this <link> AND --font-display/--font-body in src/index.css together:
      a family named in CSS but not loaded here falls silently through to the system font, and the
      page then looks like every other unstyled page no matter how good the rest of the design is.

      Sober / corporate:   Instrument Sans + Public Sans
      Warm / local trade:  Bricolage Grotesque + Karla   (the one loaded below)
      Editorial / premium: Fraunces + Work Sans
      Technical / clean:   Archivo + Source Sans 3
      Soft / elegant:      Cormorant Garamond + Karla
      Warm / appetite:     DM Serif Display + DM Sans
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Karla:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
